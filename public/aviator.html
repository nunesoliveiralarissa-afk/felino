<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aviãozinho — Tigrinho da Sorte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap game">
    <section>
      <div class="history" id="history" aria-label="Últimas quedas"></div>
      <div class="stage">
        <canvas id="cv" width="900" height="340"></canvas>
        <div class="mult" id="mult" aria-live="off">1.00x</div>
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="row">
          <div><label for="amount">Aposta</label><input id="amount" type="number" min="1" max="500" step="1" value="5"></div>
          <div><label for="autoc">Retirar automático em (x)</label><input id="autoc" type="number" min="1.01" step="0.01" placeholder="opcional"></div>
          <button class="primary" id="act">Apostar</button>
        </div>
        <p class="toast muted" id="msg" role="status"></p>
      </div>
      <details class="panel" style="margin-top:16px">
        <summary>Conferir a rodada anterior</summary>
        <p class="muted">Clique em uma queda no histórico. O navegador refaz o cálculo com o seed revelado.</p>
        <p class="mono" id="verify"></p>
      </details>
    </section>
    <aside class="panel">
      <h3>Apostas da rodada</h3>
      <div class="bets" id="bets"></div>
    </aside>
  </main>
  <script type="module" src="aviator.js"></script>
</body>
</html>
